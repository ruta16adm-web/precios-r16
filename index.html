<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R16 Autoservicio - Lista de Precios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rojo: #a3241f;
    --rojo-2: #7a1a17;
    --rojo-claro: #d34a3a;
    --crudo: #f7f3ea;
    --crudo-2: #fffdf8;
    --mostaza: #d99a1f;
    --mostaza-claro: #f7e6bd;
    --tinta: #241414;
    --verde-ok: #1f7a4d;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--crudo);
    color:var(--tinta);
    font-family:'Archivo', sans-serif;
    padding-bottom:70px;
    overflow-x:hidden;
  }

  /* ---------- HEADER ---------- */
  header{
    background:linear-gradient(135deg, var(--rojo) 0%, var(--rojo-2) 100%);
    color:var(--crudo-2);
    padding:24px 18px 18px;
    position:relative;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,0.25);
  }
  header::before{
    content:'';
    position:absolute;
    top:-60px; right:-60px;
    width:220px; height:220px;
    background:radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
    border-radius:50%;
    animation:flotar 7s ease-in-out infinite;
  }
  header::after{
    content:'';
    position:absolute;
    bottom:-80px; left:-40px;
    width:180px; height:180px;
    background:radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 70%);
    border-radius:50%;
    animation:flotar 9s ease-in-out infinite reverse;
  }
  @keyframes flotar{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(10px,-14px); }
  }
  .header-top{
    display:flex;
    align-items:center;
    gap:12px;
    position:relative;
    z-index:2;
  }
  .logo-badge{
    width:46px;height:46px;
    background:var(--crudo-2);
    color:var(--rojo);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black', sans-serif;
    font-size:18px;
    flex-shrink:0;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
    animation:aparecer 0.6s ease both;
  }
  .logo-texto{ animation:aparecer 0.6s ease 0.1s both; }
  .logo{
    font-family:'Archivo Black', sans-serif;
    font-size:23px;
    letter-spacing:0.5px;
    margin:0;
    line-height:1.1;
  }
  .subtitulo{
    font-family:'Space Mono', monospace;
    font-size:11.5px;
    opacity:0.8;
    margin-top:2px;
    letter-spacing:0.3px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .punto-vivo{
    width:7px;height:7px;
    background:#6fe08a;
    border-radius:50%;
    display:inline-block;
    animation:pulso 1.6s ease-in-out infinite;
    box-shadow:0 0 0 rgba(111,224,138,0.6);
  }
  @keyframes pulso{
    0%{ box-shadow:0 0 0 0 rgba(111,224,138,0.55); }
    70%{ box-shadow:0 0 0 7px rgba(111,224,138,0); }
    100%{ box-shadow:0 0 0 0 rgba(111,224,138,0); }
  }
  .chips-fila{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:16px;
    position:relative;
    z-index:2;
    animation:aparecer 0.6s ease 0.15s both;
  }
  .chip-destacado{
    font-family:'Archivo Black', sans-serif;
    font-size:14px;
    color:var(--rojo-2);
    background:var(--crudo-2);
    padding:7px 14px;
    border-radius:8px;
    letter-spacing:0.5px;
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
  }
  .chip{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    font-weight:700;
    color:var(--crudo-2);
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.08);
    padding:6px 11px;
    border-radius:8px;
    letter-spacing:0.5px;
    backdrop-filter:blur(2px);
  }
  .aviso{
    margin-top:10px;
    font-family:'Space Mono', monospace;
    font-size:9.5px;
    opacity:0.7;
    font-style:italic;
    position:relative;
    z-index:2;
    animation:aparecer 0.6s ease 0.2s both;
  }
  @keyframes aparecer{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- BUSCADOR ---------- */
  .buscador-caja{
    position:relative;
    margin-top:16px;
    z-index:2;
    animation:aparecer 0.6s ease 0.25s both;
  }
  .buscador{
    width:100%;
    padding:13px 40px 13px 40px;
    border-radius:12px;
    border:none;
    font-family:'Archivo', sans-serif;
    font-size:15px;
    background:var(--crudo-2);
    color:var(--tinta);
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
    transition:box-shadow 0.2s ease, transform 0.15s ease;
  }
  .buscador:focus{
    outline:none;
    box-shadow:0 4px 18px rgba(0,0,0,0.3), 0 0 0 3px rgba(255,255,255,0.35);
  }
  .buscador::placeholder{color:#a49c8b;}
  .icono-buscar{
    position:absolute;
    left:13px; top:50%;
    transform:translateY(-50%);
    opacity:0.55;
    font-size:15px;
    pointer-events:none;
  }
  .icono-limpiar{
    position:absolute;
    right:10px; top:50%;
    transform:translateY(-50%);
    background:#e4ddcb;
    color:var(--tinta);
    border:none;
    width:22px;height:22px;
    border-radius:50%;
    font-size:12px;
    cursor:pointer;
    display:none;
    align-items:center;justify-content:center;
    transition:background 0.15s ease, transform 0.15s ease;
  }
  .icono-limpiar:hover{ background:#d8cfb8; transform:translateY(-50%) scale(1.08); }

  /* ---------- NAV DE CATEGORIAS ---------- */
  .nav-categorias{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--crudo-2);
    border-bottom:1px solid #e8e1d0;
    box-shadow:0 3px 10px rgba(0,0,0,0.06);
    display:flex;
    gap:8px;
    padding:10px 14px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .nav-categorias::-webkit-scrollbar{ display:none; }
  .nav-chip{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Archivo', sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--tinta);
    background:#f1ecdf;
    border:1.5px solid transparent;
    padding:8px 13px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    transition:all 0.2s ease;
  }
  .nav-chip:hover{ background:#e9e1cc; transform:translateY(-1px); }
  .nav-chip.activo{
    background:var(--rojo);
    color:#fff;
    border-color:var(--rojo);
    box-shadow:0 3px 10px rgba(163,36,31,0.35);
  }
  .nav-chip .cant{
    background:rgba(0,0,0,0.12);
    border-radius:10px;
    padding:1px 6px;
    font-size:10px;
  }
  .nav-chip.activo .cant{ background:rgba(255,255,255,0.25); }

  /* ---------- MAIN ---------- */
  main{padding:20px 14px 10px;max-width:920px;margin:0 auto;}
  .seccion{ margin-bottom:36px; scroll-margin-top:64px; }
  .seccion-header{
    display:flex;
    align-items:baseline;
    gap:10px;
    border-bottom:3px solid var(--rojo);
    padding-bottom:8px;
    margin-bottom:16px;
  }
  .seccion-icono{ font-size:20px; }
  .seccion-titulo{
    font-family:'Archivo Black', sans-serif;
    font-size:16.5px;
    color:var(--rojo);
    letter-spacing:0.3px;
    flex:1;
  }
  .seccion-titulo--efvo ~ .lista .precio-final-tag,
  .seccion-header--efvo{ border-bottom-color: var(--mostaza); }
  .seccion-header--efvo .seccion-titulo{ color:var(--mostaza); }
  .seccion-contador{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:#a49c8b;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:10px;
  }

  .card{
    background:var(--crudo-2);
    border:1px solid #ece5d2;
    border-radius:14px;
    padding:14px 15px;
    position:relative;
    overflow:hidden;
    opacity:0;
    transform:translateY(14px);
    transition:opacity 0.5s ease, transform 0.5s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .card.visible{ opacity:1; transform:translateY(0); }
  .card:hover{
    box-shadow:0 8px 20px rgba(0,0,0,0.09);
    border-color:#ddd3b8;
    transform:translateY(-2px);
  }
  .card--destacada{
    background:linear-gradient(135deg, var(--mostaza-claro) 0%, #fdf6e6 100%);
    border-color:var(--mostaza);
  }
  .card--destacada::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg, var(--mostaza), #e8b84a, var(--mostaza));
    background-size:200% 100%;
    animation:brillo 2.2s linear infinite;
  }
  @keyframes brillo{
    0%{ background-position:0% 0; }
    100%{ background-position:200% 0; }
  }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card-nombre{
    font-size:14px;
    font-weight:600;
    line-height:1.35;
    flex:1;
    min-width:0;
  }
  .card-precios{ text-align:right; flex-shrink:0; }
  .precio-lista{
    font-family:'Space Mono', monospace;
    font-size:18px;
    font-weight:700;
    color:var(--tinta);
    white-space:nowrap;
  }
  .precio-final{
    margin-top:3px;
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    color:var(--rojo-2);
    font-weight:700;
    white-space:nowrap;
  }
  .precio-final-tag{
    font-size:8.5px;
    background:var(--rojo);
    color:#fff;
    padding:2px 5px;
    border-radius:4px;
    margin-right:4px;
    letter-spacing:0.5px;
  }
  .card-tags{ margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .tag{
    font-family:'Space Mono', monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.3px;
    padding:3px 7px;
    border-radius:5px;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:3px;
  }
  .tag--limitada{ color:#8a5a00; background:rgba(217,154,31,0.2); }
  .tag--rotacion{ color:var(--rojo-2); background:rgba(163,36,31,0.1); animation:latido 1.8s ease-in-out infinite; }
  @keyframes latido{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.05); }
  }

  /* ---------- ESTADOS ---------- */
  .skeleton-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:10px; }
  .skeleton-card{
    height:74px;
    border-radius:14px;
    background:linear-gradient(90deg, #ece5d2 25%, #f5f0e3 37%, #ece5d2 63%);
    background-size:400% 100%;
    animation:cargando-shimmer 1.4s ease infinite;
  }
  @keyframes cargando-shimmer{
    0%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .vacio, .error-carga{
    text-align:center;
    padding:50px 20px;
    font-family:'Space Mono', monospace;
    color:#a49c8b;
    display:none;
  }
  .vacio span, .error-carga span{ font-size:34px; display:block; margin-bottom:10px; }

  footer{
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:#a49c8b;
    margin-top:26px;
  }

  /* ---------- BOTON SCROLL TOP ---------- */
  .btn-arriba{
    position:fixed;
    bottom:20px; right:18px;
    width:46px;height:46px;
    border-radius:50%;
    background:var(--rojo);
    color:#fff;
    border:none;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,0.3);
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transform:translateY(12px) scale(0.9);
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:30;
  }
  .btn-arriba.mostrar{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .btn-arriba:active{ transform:scale(0.92); }

  @media (max-width:420px){
    .grid{ grid-template-columns:1fr; }
    .logo{ font-size:20px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="logo-badge">R16</div>
    <div class="logo-texto">
      <h1 class="logo">R16 AUTOSERVICIO</h1>
      <div class="subtitulo"><span class="punto-vivo"></span> Lista de precios actualizada en vivo</div>
    </div>
  </div>
  <div class="chips-fila">
    <div class="chip-destacado">PRECIOS SIN IVA</div>
    <div class="chip">PRECIOS CONTADO EFECTIVO</div>
  </div>
  <div class="aviso">Precio sujeto a modificación. Stock a confirmar en sucursal.</div>
  <div class="buscador-caja">
    <span class="icono-buscar">🔍</span>
    <input class="buscador" id="buscador" type="text" placeholder="Buscar producto..." disabled>
    <button class="icono-limpiar" id="btnLimpiar" aria-label="Limpiar búsqueda">✕</button>
  </div>
</header>

<nav class="nav-categorias" id="navCategorias"></nav>

<main id="main">
  <div class="skeleton-grid">
    <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
    <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
  </div>
</main>
<div class="vacio" id="vacio"><span>🔎</span>No se encontraron productos.</div>
<div class="error-carga" id="errorCarga"><span>⚠️</span>No se pudieron cargar los precios en este momento.<br>Probá de nuevo en unos minutos.</div>
<footer id="footer"></footer>

<button class="btn-arriba" id="btnArriba" aria-label="Volver arriba">↑</button>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMN4p3KO7VgU5H6u_vOPXUjGBpm5UQGA6XTmYzPjg6H7J1eFr4MmfiYjB35gvWvXnzl6miZh33HnZ1/pub?gid=319886470&single=true&output=csv';

  const SECCIONES_CONFIG = [
    { nombre: 'BEBIDAS X MAYOR',                icono: '🥤' },
    { nombre: 'MERCADERIA X MAYOR',             icono: '🛒' },
    { nombre: 'SNACK P/ MAYOR',                 icono: '🍟' },
    { nombre: 'OFERTAS CON DESCUENTO EN EFECTIVO', icono: '💵', efectivo: true }
  ];

  function parsearCSV(texto) {
    const filas = [];
    let fila = [];
    let campo = '';
    let dentroComillas = false;
    for (let i = 0; i < texto.length; i++) {
      const c = texto[i];
      if (dentroComillas) {
        if (c === '"') {
          if (texto[i + 1] === '"') { campo += '"'; i++; }
          else { dentroComillas = false; }
        } else {
          campo += c;
        }
      } else {
        if (c === '"') dentroComillas = true;
        else if (c === ',') { fila.push(campo); campo = ''; }
        else if (c === '\n') { fila.push(campo); filas.push(fila); fila = []; campo = ''; }
        else if (c === '\r') { /* ignorar */ }
        else campo += c;
      }
    }
    if (campo.length > 0 || fila.length > 0) { fila.push(campo); filas.push(fila); }
    return filas.filter(f => f.length > 1 || f[0] !== '');
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatearNum(n) {
    if (n === '' || n === null || n === undefined || isNaN(n)) return '';
    return Number(n).toLocaleString('es-AR');
  }

  function slug(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-');
  }

  function renderCard(p, esEfectivo) {
    const destacadoClass = p.destacado ? ' card--destacada' : '';
    let etiquetas = '';
    if (p.destacado) etiquetas += '<span class="tag tag--limitada">★ TIEMPO LIMITADO</span>';
    if (p.stock < 0) etiquetas += '<span class="tag tag--rotacion">🔥 ALTA ROTACIÓN</span>';

    let precioFinalHtml = '';
    if (p.detalle) {
      const label = esEfectivo ? 'EFECTIVO' : 'OFERTA';
      precioFinalHtml = '<div class="precio-final"><span class="precio-final-tag">' + label + '</span>' + esc(p.detalle) + '</div>';
    }

    return '<div class="card' + destacadoClass + '" data-nombre="' + esc(String(p.producto).toLowerCase()) + '">' +
      '<div class="card-top">' +
        '<div class="card-nombre">' + esc(p.producto) + '</div>' +
        '<div class="card-precios">' +
          '<div class="precio-lista">$' + formatearNum(p.precioLista) + '</div>' +
          precioFinalHtml +
        '</div>' +
      '</div>' +
      (etiquetas ? '<div class="card-tags">' + etiquetas + '</div>' : '') +
    '</div>';
  }

  function activarRevelado() {
    const obs = new IntersectionObserver((entradas) => {
      entradas.forEach((entrada, i) => {
        if (entrada.isIntersecting) {
          setTimeout(() => entrada.target.classList.add('visible'), Math.min(i, 10) * 35);
          obs.unobserve(entrada.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
    document.querySelectorAll('.card').forEach(c => obs.observe(c));
  }

  function activarNavActiva() {
    const secciones = document.querySelectorAll('.seccion');
    const chips = document.querySelectorAll('.nav-chip');
    if (!secciones.length) return;
    const obs = new IntersectionObserver((entradas) => {
      entradas.forEach(entrada => {
        if (entrada.isIntersecting) {
          const id = entrada.target.id;
          chips.forEach(chip => chip.classList.toggle('activo', chip.dataset.target === id));
        }
      });
    }, { rootMargin: '-80px 0px -70% 0px', threshold: 0 });
    secciones.forEach(s => obs.observe(s));
  }

  fetch(CSV_URL)
    .then(r => {
      if (!r.ok) throw new Error('No se pudo cargar');
      return r.text();
    })
    .then(texto => {
      const filas = parsearCSV(texto);
      filas.shift(); // encabezados

      const grupos = {};
      filas.forEach(row => {
        const seccion = String(row[0] || '').trim().toUpperCase();
        if (!seccion) return;
        if (!grupos[seccion]) grupos[seccion] = [];
        grupos[seccion].push({
          producto: row[1],
          precioLista: row[2],
          precioFinal: row[3],
          detalle: row[4],
          destacado: row[5] === 'SI',
          stock: Number(row[6]) || 0
        });
      });

      Object.keys(grupos).forEach(sec => {
        grupos[sec].sort((a, b) => {
          const aNeg = a.stock < 0, bNeg = b.stock < 0;
          if (aNeg && !bNeg) return -1;
          if (!aNeg && bNeg) return 1;
          if (aNeg && bNeg && a.stock !== b.stock) return a.stock - b.stock;
          return String(a.producto).localeCompare(String(b.producto), 'es', { sensitivity: 'base' });
        });
      });

      let navHtml = '';
      let mainHtml = '';
      let totalProductos = 0;

      SECCIONES_CONFIG.forEach(cfg => {
        const items = grupos[cfg.nombre];
        if (!items || items.length === 0) return;
        const id = 'sec-' + slug(cfg.nombre);
        totalProductos += items.length;

        navHtml += '<div class="nav-chip" data-target="' + id + '" onclick="document.getElementById(\'' + id + '\').scrollIntoView({behavior:\'smooth\'})">' +
          '<span>' + cfg.icono + '</span><span>' + esc(cfg.nombre) + '</span><span class="cant">' + items.length + '</span>' +
        '</div>';

        mainHtml += '<section class="seccion" id="' + id + '" data-seccion="' + esc(cfg.nombre) + '">';
        mainHtml += '<div class="seccion-header' + (cfg.efectivo ? ' seccion-header--efvo' : '') + '">' +
          '<span class="seccion-icono">' + cfg.icono + '</span>' +
          '<span class="seccion-titulo">' + esc(cfg.nombre) + '</span>' +
          '<span class="seccion-contador">' + items.length + ' productos</span>' +
        '</div>';
        mainHtml += '<div class="grid">';
        items.forEach(p => { mainHtml += renderCard(p, cfg.efectivo); });
        mainHtml += '</div></section>';
      });

      document.getElementById('navCategorias').innerHTML = navHtml;
      document.getElementById('main').innerHTML = mainHtml;
      document.getElementById('footer').textContent = totalProductos + ' productos · Actualizado: ' + new Date().toLocaleString('es-AR');

      activarRevelado();
      activarNavActiva();

      const input = document.getElementById('buscador');
      const btnLimpiar = document.getElementById('btnLimpiar');
      input.disabled = false;
      const secciones = Array.from(document.querySelectorAll('.seccion'));
      const vacio = document.getElementById('vacio');

      function filtrar() {
        const q = input.value.toLowerCase().trim();
        btnLimpiar.style.display = q ? 'flex' : 'none';
        let algunaVisible = false;
        secciones.forEach(sec => {
          let visibles = 0;
          sec.querySelectorAll('.card').forEach(card => {
            const match = card.getAttribute('data-nombre').includes(q);
            card.style.display = match ? '' : 'none';
            if (match) { visibles++; card.classList.add('visible'); }
          });
          sec.style.display = visibles > 0 ? '' : 'none';
          if (visibles > 0) algunaVisible = true;
        });
        vacio.style.display = algunaVisible ? 'none' : 'block';
        document.getElementById('navCategorias').style.display = q ? 'none' : 'flex';
      }

      input.addEventListener('input', filtrar);
      btnLimpiar.addEventListener('click', () => { input.value=''; filtrar(); input.focus(); });
    })
    .catch(err => {
      document.getElementById('main').innerHTML = '';
      document.getElementById('errorCarga').style.display = 'block';
    });

  // Boton volver arriba
  const btnArriba = document.getElementById('btnArriba');
  window.addEventListener('scroll', () => {
    btnArriba.classList.toggle('mostrar', window.scrollY > 500);
  });
  btnArriba.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
</script>
</body>
</html>
